http:
  addr: ":8080"

mcp:
  config_path: ".mcp.json"

database:
  driver: "sqlite"
  dsn: "./alert-agent.db"

llm:
  provider: "openai"          # openai | anthropic
  api_key: ""
  base_url: ""
  model: ""                   # empty = provider default (openai→gpt-4o, anthropic→claude-opus-4-8)
  max_tokens: 4096
  context_limit: 0            # Model context window size (0 = no limit)

telegram:
  bot_token: ""
  default_channel: ""

slack:
  bot_token: ""
  default_channel: ""

redis:
  url: ""                     # Redis URL (empty = in-memory, e.g. "redis://localhost:6379")

alert_cooldown: "48h"
