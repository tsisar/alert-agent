name: Build image

on:
  push:
    branches: [main, release]
    tags: ["v*"]
    paths:
      - "cmd/**"
      - "internal/**"
      - "configs/**"
      - "go.mod"
      - "go.sum"
      - "Dockerfile"
      - ".github/workflows/image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io/tsisar
  IMAGE: alert-agent
  DOCKERFILE: Dockerfile

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Compute tags
        id: tags
        run: |
          SHORT=$(git rev-parse --short HEAD)
          DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME}"
            case "$VERSION" in
              *-rc*|*-beta*|*-alpha*)
                # Pre-release tag: do not move :latest
                TAGS="${REGISTRY}/${IMAGE}:${VERSION}"
                ;;
              *)
                TAGS="${REGISTRY}/${IMAGE}:${VERSION},${REGISTRY}/${IMAGE}:${SHORT},${REGISTRY}/${IMAGE}:latest"
                ;;
            esac
          elif [ "$GITHUB_REF_NAME" = "main" ]; then
            VERSION="${SHORT}"
            TAGS="${REGISTRY}/${IMAGE}:${SHORT},${REGISTRY}/${IMAGE}:main"
          elif [ "$GITHUB_REF_NAME" = "release" ]; then
            VERSION="rc-${SHORT}"
            TAGS="${REGISTRY}/${IMAGE}:rc-${SHORT},${REGISTRY}/${IMAGE}:release"
          else
            VERSION="${SHORT}-dev"
            TAGS="${REGISTRY}/${IMAGE}:${SHORT}-dev"
          fi
          {
            echo "version=${VERSION}"
            echo "commit=${SHORT}"
            echo "date=${DATE}"
            echo "tags=${TAGS}"
          } >> "$GITHUB_OUTPUT"
          echo "Version: ${VERSION}"
          echo "Tags: ${TAGS}"

      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ env.DOCKERFILE }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            VERSION=${{ steps.tags.outputs.version }}
            COMMIT=${{ steps.tags.outputs.commit }}
            DATE=${{ steps.tags.outputs.date }}
          cache-from: type=gha,scope=${{ env.IMAGE }}
          cache-to: type=gha,mode=max,scope=${{ env.IMAGE }}
