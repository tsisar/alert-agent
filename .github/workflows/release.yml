name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  github-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Extract CHANGELOG section
        id: changelog
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          BODY=$(awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" { flag=1; next }
            flag && $0 ~ "^## \\[" { exit }
            flag { print }
          ' CHANGELOG.md)
          if [ -z "$BODY" ]; then
            echo "No CHANGELOG section found for [$VERSION]; falling back to autogenerated notes." >&2
            echo "found=false" >> "$GITHUB_OUTPUT"
          else
            echo "found=true" >> "$GITHUB_OUTPUT"
            {
              echo "body<<EOF_CHANGELOG"
              echo "$BODY"
              echo "EOF_CHANGELOG"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Detect pre-release
        id: prerelease
        run: |
          case "${GITHUB_REF_NAME}" in
            *-rc*|*-beta*|*-alpha*) echo "prerelease=true"  >> "$GITHUB_OUTPUT" ;;
            *)                      echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          body: ${{ steps.changelog.outputs.body }}
          generate_release_notes: ${{ steps.changelog.outputs.found == 'false' }}
          prerelease: ${{ steps.prerelease.outputs.prerelease }}
